name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run typecheck && npm run build && npm test && npm run lint

  # packs the tarball, installs it in a throwaway repo, then drives the CLI and the MCP server
  # through the Inspector CLI, which needs Node 22.19 or newer
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22.19' }
      - run: npm ci
      - run: npm run e2e
      # examples/faq-check against this repo's own docs: if a doc edit stops answering a question, say so here
      - run: npm run -s build && node examples/faq-check/check.mjs
